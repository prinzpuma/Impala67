[package]
name = "impala-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "E2EE: Schlüsselableitung (PBKDF2), AES-GCM-Pakete, Blob-Layout, gzip, Base64/Hex, SecureStore"

[lints]
workspace = true

[features]
default = ["file-store"]
# Standard-SecureStore als verschlüsselte Datei (std::fs). Ohne dieses Feature bleibt nur
# das reine Versiegeln/Öffnen (z. B. für WASM, das den Tresor in IndexedDB ablegt).
file-store = []

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }

# Im Browser: crypto.getRandomValues (nur dort, sonst bläht es den Lockfile-Baum auf).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[package]
name = "impala-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sync-Protokoll v4: Event-Kompaktierung, Wire-Format, Chunking, Pakete, Cloudflare-Ablauf"

[lints]
workspace = true

[dependencies]
impala-crypto = { path = "../impala-crypto", default-features = false }
impala-net = { path = "../impala-net", default-features = false }
# preserve_order: Schlüsselreihenfolge wie JSON.stringify; float_roundtrip: Zahlen exakt wie JSON.parse.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
serde_json = "1"

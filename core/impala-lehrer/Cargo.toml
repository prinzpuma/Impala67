[package]
name = "impala-lehrer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "KI-Zeitstrahl-Modus: Datenmodell, Layout, Fortschritt und Quiz-Auswertung (docs/KI-LEHRERMODUS-PLAN.md §6)"

[lints]
workspace = true

[dependencies]
impala-sort = { path = "../impala-sort" }
serde = { version = "1", features = ["derive"] }
# preserve_order: Schlüsselreihenfolge der JSON-Ausgabe bleibt wie geschrieben.
serde_json = { version = "1", features = ["preserve_order"] }

[package]
name = "impala-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
impala-sync = { path = "../impala-sync" }
impala-crypto = { path = "../impala-crypto", default-features = false }
impala-drive = { path = "../impala-drive", default-features = false }
impala-net = { path = "../impala-net", default-features = false }
impala-search = { path = "../impala-search", default-features = false }
impala-ink = { path = "../impala-ink", default-features = false }
impala-srs = { path = "../impala-srs" }
impala-markdown = { path = "../impala-markdown" }
impala-heft = { path = "../impala-heft" }
serde = "1"
serde_json = "1"
js-sys = "0.3"
# Exakt gepinnt: wasm-bindgen-cli (npm run build:core) muss dieselbe Version haben.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

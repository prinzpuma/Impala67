# Rust-Kern von Impala67 (Plan: docs/NATIV-PLAN.md).
# impala-core: Fassade über alle Fach-Crates (impala-*), später per UniFFI für Swift/Kotlin.
# impala-wasm: dünne wasm-bindgen-Hülle für die PWA (Build: npm run build:core).
[workspace]
resolver = "3"
members = [
    "impala-core",
    "impala-ai",
    "impala-crypto",
    "impala-drive",
    "impala-heft",
    "impala-ink",
    "impala-markdown",
    "impala-model",
    "impala-net",
    "impala-search",
    "impala-srs",
    "impala-storage",
    "impala-sync",
    "impala-wasm",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

# Messungen nativ: volle Optimierung statt Größe (cargo bench bzw. --profile native).
[profile.bench]
opt-level = 3

[profile.native]
inherits = "release"
opt-level = 3
panic = "unwind"

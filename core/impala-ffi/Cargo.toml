[package]
name = "impala-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI-Hülle des Kerns für native Apps (Kotlin, Swift, C#)"

[lints]
workspace = true

[lib]
# cdylib: Android (.so), Windows (.dll); staticlib: iOS (.a); lib: Rust-Tests und uniffi-bindgen.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# Erzeugt die Bindings aus der gebauten Bibliothek, z. B.
# cargo run -p impala-ffi --bin uniffi-bindgen -- generate --library <lib> --language kotlin --out-dir <dir>
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
impala-model = { path = "../impala-model" }
impala-search = { path = "../impala-search", default-features = false }
impala-srs = { path = "../impala-srs" }
impala-storage = { path = "../impala-storage" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uniffi = { version = "0.29", features = ["cli"] }
uuid = { version = "1", features = ["v4"] }

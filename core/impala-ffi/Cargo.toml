[package]
name = "impala-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "UniFFI-HÃ¼lle des Kerns fÃ¼r native Apps (Kotlin, Swift, C#)"

[lints]
workspace = true

[lib]
# cdylib: Android (.so), Windows (.dll); staticlib: iOS (.a); lib: Rust-Tests und uniffi-bindgen.
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# Erzeugt die Bindings aus der gebauten Bibliothek, z. B.
# cargo run -p impala-ffi --bin uniffi-bindgen -- generate --library <lib> --language kotlin --out-dir <dir>
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
base64 = "0.22"
impala-ai = { path = "../impala-ai" }
impala-crypto = { path = "../impala-crypto" }
impala-drive = { path = "../impala-drive" }
impala-fach = { path = "../impala-fach" }
impala-heft = { path = "../impala-heft" }
impala-markdown = { path = "../impala-markdown" }
impala-model = { path = "../impala-model" }
impala-net = { path = "../impala-net" }
impala-scan = { path = "../impala-scan" }
impala-sync = { path = "../impala-sync" }
# onnx: lokales Embedding-Modell (Bekko a8m) im Kern statt einer Plattform-Laufzeit.
impala-search = { path = "../impala-search", default-features = false, features = ["onnx"] }
impala-srs = { path = "../impala-srs" }
impala-storage = { path = "../impala-storage" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
uniffi = { version = "0.29", features = ["cli"] }
uuid = { version = "1", features = ["v4"] }

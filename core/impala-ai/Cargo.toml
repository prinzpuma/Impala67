[package]
name = "impala-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "KI-Anbieter: Anfragen, Streaming-Parser, Agent-Schleife, LlmProvider"

[lints]
workspace = true

[features]
# Standard-HTTP-Client (ureq) aus impala-net. Ohne dieses Feature baut das Crate für
# wasm32-unknown-unknown; die Plattform setzt dann ihren eigenen HttpClient ein.
default = ["client"]
client = ["impala-net/client"]

[dependencies]
impala-net = { path = "../impala-net", default-features = false }
# Ohne Unicode-Tabellen (~1 MB WASM): die Muster sind ASCII bzw. listen Leerzeichen selbst auf.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src * data: blob:; worker-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<script>
function showErrorOverlay(title, details, stack) {
	const div = document.createElement("div");
	div.style.cssText = "position:fixed;inset:0;background:rgba(255,0,0,0.95);color:#fff;z-index:999999;padding:20px;font-family:monospace;font-size:16px;overflow:auto;";
	const heading = document.createElement("h1");
	heading.textContent = title;
	div.appendChild(heading);
	Object.entries(details || {}).forEach(function (entry) {
		const p = document.createElement("p");
		const strong = document.createElement("strong");
		strong.textContent = entry[0] + ": ";
		p.appendChild(strong);
		p.appendChild(document.createTextNode(String(entry[1] == null ? "" : entry[1])));
		div.appendChild(p);
	});
	const pre = document.createElement("pre");
	pre.textContent = stack || "";
	div.appendChild(pre);
	document.documentElement.appendChild(div);
}
window.onerror = function (message, source, lineno, colno, error) {
	showErrorOverlay("Frontend Error Caught", { Message: message, Source: source, Position: lineno + ":" + colno }, error && error.stack);
	return false;
};
window.onunhandledrejection = function (event) {
	showErrorOverlay("Unhandled Promise Rejection", { Reason: event.reason }, event.reason && event.reason.stack);
};
function resetTransientUiLayers() {
	document.body.classList.remove("mnav-open");
	["overlay", "palette", "attachMenu", "modelMenu"].forEach((id) => {
		const el = document.getElementById(id);
		if (el) el.hidden = true;
	});
}
window.addEventListener("pageshow", resetTransientUiLayers);
</script>

<body class="panel-collapsed">
<script>
(function () {
	try {
		var followSystem = localStorage.getItem("impala67FollowSystemTheme") !== "0";
		var theme = followSystem && window.matchMedia
			? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
			: (localStorage.getItem("impala67Theme") || localStorage.getItem("notionTheme") || "dark");
		var density = localStorage.getItem("impala67Density") || "compact";
		var motion = localStorage.getItem("impala67Motion") || "reduced";
		var fontSize = localStorage.getItem("impala67FontSize") || "m";
		document.body.classList.toggle("light", theme === "light");
		document.body.classList.toggle("density-compact", density === "compact");
		document.body.classList.toggle("reduce-motion", motion === "reduced");
		document.body.classList.toggle("font-s", fontSize === "s");
		document.body.classList.toggle("font-l", fontSize === "l");
		document.body.classList.toggle("sidebar-collapsed", localStorage.getItem("impala67.sidebarCollapsed") === "1");
		var sidebarWidth = Number(localStorage.getItem("impala67.sidebarWidth") || 0);
		if (sidebarWidth) document.body.style.setProperty("--sidebar-w", Math.max(200, Math.min(420, sidebarWidth)) + "px");
		var themeColor = document.querySelector('meta[name="theme-color"]');
		if (themeColor) themeColor.content = theme === "light" ? "#f2efe9" : "#05070d";
	} catch (_) {}
})();
</script>

	<div id="bootSplashMsg" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center">Impala67 Test-Startseite lädt…</div>
	<style>@keyframes bootspin{to{transform:rotate(360deg)}}</style>
</div>

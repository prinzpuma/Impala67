apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "org.impala67.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "org.impala67.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 202087
        versionName "2.2.87"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def keyAliasVal = System.getenv("ANDROID_KEY_ALIAS")
            def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD")

            def keyPropsFile = rootProject.file('key.properties')
            if (!keyPropsFile.exists()) {
                keyPropsFile = file('key.properties')
            }
            if (keyPropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keyPropsFile))
                keystorePath = keystorePath ?: props.getProperty('storeFile')
                keystorePassword = keystorePassword ?: props.getProperty('storePassword')
                keyAliasVal = keyAliasVal ?: props.getProperty('keyAlias')
                keyPasswordVal = keyPasswordVal ?: props.getProperty('keyPassword')
            }

            if (!keystorePath && file('release.keystore').exists()) {
                keystorePath = 'release.keystore'
                keystorePassword = keystorePassword ?: 'impala67release'
                keyAliasVal = keyAliasVal ?: 'impala67'
                keyPasswordVal = keyPasswordVal ?: 'impala67release'
            }

            if (keystorePath) {
                def kFile = file(keystorePath)
                if (kFile.exists()) {
                    storeFile kFile
                    storePassword keystorePassword ?: ""
                    keyAlias keyAliasVal ?: ""
                    keyPassword keyPasswordVal ?: ""
                }
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // JNA für UniFFI-Bindings
    implementation "net.java.dev.jna:jna:5.15.0@aar"

    // Kotlin & Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // AndroidX Core & Lifecycle
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity-compose:1.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"

    // Jetpack Compose & Material 3 Expressive
    def composeBom = platform("androidx.compose:compose-bom:2025.02.00")
    implementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3:1.4.0-alpha07"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.8.7"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Jetpack Ink (latenzfreie Stifteingabe & Hardware-Prädiktion)
    implementation "androidx.ink:ink-authoring:1.0.0-alpha04"
    implementation "androidx.ink:ink-brush:1.0.0-alpha04"
    implementation "androidx.ink:ink-geometry:1.0.0-alpha04"
    implementation "androidx.ink:ink-nativeloader:1.0.0-alpha04"
    implementation "androidx.ink:ink-rendering:1.0.0-alpha04"
    implementation "androidx.ink:ink-strokes:1.0.0-alpha04"
    implementation "androidx.input:input-motionprediction:1.0.0-beta05"

    // ML Kit: Digital Ink Recognition (Handschrift) & Document Scanner
    implementation "com.google.mlkit:digital-ink-recognition:18.1.0"
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1"
    implementation "com.google.android.gms:play-services-auth:21.3.0"

    // Hintergrund-Sync, Sicherheit & Netzwerk (WebSocket)
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Tests
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

# Einzige Quelle für Versionen der Android-App. Neue Abhängigkeiten nur hier eintragen.
# Stand: 2026-10-28 (Google Maven / Maven Central). Regel: neueste stabile Version; Vorabversion
# nur, wo sie nötige Funktionen bringt – hier Material 3 1.5.0 (Expressive-Bausteine).
# Die "später"-Einträge sind schon geprüft und werden erst mit ihrem Modul eingebunden.

[versions]
agp = "9.5.0"
kotlin = "2.4.21"
coroutines = "1.11.0"
compose-bom = "2026.09.00"
material3 = "1.5.0-beta02"
material3-adaptive = "1.3.0"
navigation3 = "1.2.0"
lifecycle = "2.11.0"
activity = "1.13.0"
core-ktx = "1.19.1"
core-splashscreen = "1.2.0"
datastore = "1.3.0"
work = "2.12.0"
jna = "5.19.1"
# später: Heft (Stift), Scanner, PDF, Handschrift, QR
ink = "1.0.0"
camera = "1.6.2"
pdf-viewer = "1.0.0-beta01"
mlkit-document-scanner = "16.0.0"
mlkit-digital-ink = "19.0.0"
mlkit-barcode = "17.3.0"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "core-splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
# Über die BOM hinweg erzwungen (Expressive): Version steht hier, nicht in der BOM.
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
compose-material3-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
compose-material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3-adaptive" }

navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# UniFFI-Bindings (uniffi/impala_ffi) laden den Rust-Kern über JNA.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# später
androidx-ink-authoring = { module = "androidx.ink:ink-authoring", version.ref = "ink" }
androidx-ink-brush = { module = "androidx.ink:ink-brush", version.ref = "ink" }
androidx-ink-geometry = { module = "androidx.ink:ink-geometry", version.ref = "ink" }
androidx-ink-rendering = { module = "androidx.ink:ink-rendering", version.ref = "ink" }
androidx-ink-strokes = { module = "androidx.ink:ink-strokes", version.ref = "ink" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camera" }
androidx-pdf-viewer-fragment = { module = "androidx.pdf:pdf-viewer-fragment", version.ref = "pdf-viewer" }
mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkit-document-scanner" }
mlkit-digital-ink = { module = "com.google.mlkit:digital-ink-recognition", version.ref = "mlkit-digital-ink" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode" }

[bundles]
compose = ["compose-ui", "compose-ui-tooling-preview", "compose-foundation", "compose-material3", "compose-material3-navigation-suite", "compose-material3-adaptive", "compose-material3-adaptive-layout", "compose-material3-adaptive-navigation3"]
navigation3 = ["navigation3-runtime", "navigation3-ui", "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-viewmodel-navigation3"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 bringt Kotlin selbst mit; der Eintrag hebt nur die Kotlin-Version auf 2.4.21.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Navigation 3 speichert den Back-Stack über @Serializable-Routen.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

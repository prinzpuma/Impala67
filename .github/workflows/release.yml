name: Release & Android APK veröffentlichen

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release-Typ'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      manual_version:
        description: 'Manuelle Versionsnummer (z. B. 2.3.0, nur bei Typ manual)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  version:
    name: Release-Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests und Syntax prüfen
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E '^(<<<<<<< |>>>>>>> )' .; then
            echo "::error::Ungelöste Git-Konfliktmarker gefunden."
            exit 1
          fi
          npm run verify

      - name: Version berechnen und Tag vorbereiten
        id: ver
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            TYPE="${{ github.event.inputs.release_type }}"
            if [ "$TYPE" = "manual" ]; then
              VERSION="${{ github.event.inputs.manual_version }}"
              if [ -z "$VERSION" ]; then
                echo "::error::Manuelle Version darf nicht leer sein."
                exit 1
              fi
            else
              CURRENT=$(node -p "require('./web/version.json').version")
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
              if [ "$TYPE" = "major" ]; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif [ "$TYPE" = "minor" ]; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              VERSION="$MAJOR.$MINOR.$PATCH"
              while git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; do
                PATCH=$((PATCH + 1))
                VERSION="$MAJOR.$MINOR.$PATCH"
              done
            fi
            TAG="v$VERSION"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" "$GITHUB_SHA" -m "Impala67 $TAG"
              git push origin "$TAG"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-apk:
    name: Native Android Release APK bauen
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Versionsdateien synchronisieren
        run: node .github/scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle Wrapper ausführbar machen
        working-directory: android
        run: chmod +x gradlew

      - name: Release-Keystore vorbereiten (GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release-Keystore aus Secret decodieren..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "ANDROID_KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "Hinweis: Kein ANDROID_KEYSTORE_BASE64 Secret hinterlegt. APK wird mit Debug-Signatur als installierbarer Fallback gebaut."
          fi

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Release APK bauen
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log || {
            echo "==================== GRADLE ERROR LOG ===================="
            tail -n 120 gradle-build.log
            exit 1
          }

      - name: Gradle Build Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle-build.log
          if-no-files-found: ignore

      - name: APK bereitstellen
        run: cp android/app/build/outputs/apk/release/app-release.apk Impala67.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: impala67-apk
          path: Impala67.apk
          if-no-files-found: error

  publish:
    name: GitHub Release veröffentlichen
    needs: [version, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: APK Artefakt herunterladen
        uses: actions/download-artifact@v4.1.3
        with:
          name: impala67-apk
          path: apk-dist

      - name: Release erstellen oder aktualisieren
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits – lade Impala67.apk hoch..."
            gh release upload "$TAG" apk-dist/Impala67.apk --clobber
          else
            echo "Erstelle GitHub Release $TAG mit Impala67.apk..."
            gh release create "$TAG" apk-dist/Impala67.apk \
              --title "Impala67 $TAG" \
              --notes "Offizielles Release $TAG – PWA und native Android APK." \
              --latest
          fi

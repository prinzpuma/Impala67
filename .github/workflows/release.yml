name: PWA veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pwa-release
  cancel-in-progress: false

jobs:
  version:
    name: Prüfen und Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: PWA-Dateien prüfen
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git -E '^(<<<<<<< |>>>>>>> )' .; then
            echo "::error::Ungelöste Git-Konfliktmarker gefunden."
            exit 1
          fi
          node -e 'JSON.parse(require("fs").readFileSync("web/version.json", "utf8")); console.log("Gültiges web/version.json")'
          npm run verify

      - name: Nächste freie Version bestimmen
        id: next
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./web/version.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          # version.json ist der zuletzt bekannte Stand; jede Veröffentlichung
          # erhält daher mindestens die nächste Patch-Version.
          PATCH=$((PATCH + 1))
          NEW="$MAJOR.$MINOR.$PATCH"
          while git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null 2>&1; do
            PATCH=$((PATCH + 1))
            NEW="$MAJOR.$MINOR.$PATCH"
          done
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

  deploy:
    name: PWA auf GitHub Pages veröffentlichen
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Versionsdateien setzen
        run: node .github/scripts/set-version.mjs "${{ needs.version.outputs.version }}"
      - name: PWA prüfen
        run: |
          find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node .github/scripts/check-version-sync.mjs "${{ needs.version.outputs.version }}"
          node .github/scripts/check-pwa-cache.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5

  build-apk:
    name: Android APK bauen
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Versionsdateien setzen
        run: node .github/scripts/set-version.mjs "${{ needs.version.outputs.version }}"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew
      - name: Capacitor Sync
        run: npx cap sync android
      - name: Debug APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon
      - name: APK für Release vorbereiten
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Impala67.apk
      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: impala67-apk
          path: Impala67.apk
          if-no-files-found: error

  release:
    name: GitHub Release & APK veröffentlichen
    needs: [version, deploy, build-apk]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: APK Artefakt herunterladen
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: impala67-apk
          path: apk-dist
      - name: Release erstellen und APK anhängen
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits; Release-Erstellung wird übersprungen."
            exit 0
          fi
          git tag -a "$TAG" "$GITHUB_SHA" -m "Impala67 $TAG"
          git push origin "$TAG"

          if [ -f apk-dist/Impala67.apk ]; then
            echo "Erstelle GitHub Release mit Impala67.apk..."
            gh release create "$TAG" apk-dist/Impala67.apk \
              --title "Impala67 $TAG" \
              --notes "Release $TAG – PWA und native Android APK." \
              --latest
          else
            echo "Erstelle GitHub Release ohne APK..."
            gh release create "$TAG" \
              --title "Impala67 $TAG" \
              --notes "Release $TAG – PWA." \
              --latest
          fi

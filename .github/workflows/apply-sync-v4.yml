name: Validate and integrate sync v4

on:
  push:
    branches: [sync-v4-rewrite]
    paths: [.github/workflows/apply-sync-v4.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync-v4-rewrite
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply v4 integration patches
        run: |
          set -euo pipefail
          node scripts/apply-sync-v4-integration.mjs
          rm -f test/sync-cloudflare.test.mjs test/sync-cloudflare-integration.test.mjs

      - name: Full test suite
        run: npm test

      - name: Syntax check
        run: |
          set -euo pipefail
          find web server -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Wrangler dry run
        run: npm run dry-run

      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/db.js web/heft.js web/tools.js
          git add -u -- test/sync-cloudflare.test.mjs test/sync-cloudflare-integration.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Integrate sync v4 invariants"
          git push origin HEAD:sync-v4-rewrite

# Xcode-Projekt für die native iPad-App. Das .xcodeproj wird nicht committet, sondern erzeugt:
#   xcodegen generate   (im Ordner ios/, braucht macOS; die CI macht das in ios-build.yml)
name: Impala67
options:
  bundleIdPrefix: org.impala67
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Impala67:
    type: application
    platform: iOS
    sources:
      - path: Impala67
    # Einträge, die es nicht als INFOPLIST_KEY_* gibt (Listen, eigene Schlüssel). XcodeGen schreibt die
    # Datei beim Generieren; Xcode ergänzt sie um die INFOPLIST_KEY_*-Werte unten.
    info:
      path: Info.plist
      properties:
        # Hintergrund-Sync (BGTaskScheduler, `AppModel.refreshTask`).
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.impala67.app.sync]
        # Google-Drive-Backup: iOS-OAuth-Client-ID (siehe GOOGLE_IOS_CLIENT_ID unten).
        ImpalaGoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
    settings:
      base:
        # PLATZHALTER: OAuth-Client vom Typ „iOS“ (Bundle-ID org.impala67.app) im selben Google-Cloud-
        # Projekt wie die Web-Client-ID der PWA, z. B. 1234-abcd.apps.googleusercontent.com. Kein Geheimnis.
        GOOGLE_IOS_CLIENT_ID: DEINE_IOS_CLIENT_ID.apps.googleusercontent.com
        PRODUCT_BUNDLE_IDENTIFIER: org.impala67.app
        PRODUCT_NAME: Impala67
        # iPad zuerst; auf dem iPhone läuft dieselbe Oberfläche (NavigationSplitView klappt zusammen).
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Impala67
        # App-Icon aus web/icon.svg (npm run ios:app-icon → Assets.xcassets/AppIcon.appiconset).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # QR-Kopplung (VisionKit-Scanner).
        INFOPLIST_KEY_NSCameraUsageDescription: Zum Scannen des Kopplungs-QR-Codes eines anderen Geräts.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Rust-Kern: C-Modul impala_ffiFFI (Bindings/) + statische Bibliothek (Frameworks/, von tools/ios-core.mjs).
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Bindings
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Frameworks
        OTHER_LDFLAGS: -limpala_ffi
        # Nur arm64-Geräte; einen Simulator gibt es ohne Mac ohnehin nicht.
        ARCHS: arm64
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        # Unsigniert bauen; AltStore/SideStore/Sideloadly signieren beim Installieren.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
